# Right-sidebar browser automation for DSH Desktop.
#
# The row mounts both halves: index.js (tools + playwright-cli + the page bridge)
# and client.js (declared in package.json under dsh.client), which owns
# ctx.sidebarRight.openTab.
- insert:
    - id: browser-automation
      name: '@local/dsh-browser-automation'
      config:
        # playwright-cli session name (`-s=`). One session is shared by every
        # DSH session; the page identity (its session digest), not the CLI
        # session, separates their pages.
        session: dsh
        # There is deliberately no port setting: the port is whatever DSH Desktop was
        # started with (--remote-debugging-port=0 for a fresh one per launch, or a fixed
        # number), and the plugin reads it from DevToolsActivePort in the app's
        # user-data directory. Changing a setting here could not move that port.
        # Attach at startup so sidebar pages opened afterwards are visible to the CLI.
        # Costs one daemon process while DSH runs; only one DSH instance at a time.
        autoAttach: true
        # Overlay badge above the sidebar for the controlled page in view
        # ("正在与智能体共享"); never painted into the page.
        showSharedBadge: true
        # CLI command or absolute path. Defaults to `playwright-cli` on PATH.
        command: playwright-cli
        # Which Node runs the CLI's JavaScript entry (the Host is Electron, so its
        # own execPath is not node):
        #   auto  -> DSH's bundled runtime node, then PATH, then ELECTRON_RUN_AS_NODE
        #   path  -> PATH only
        #   <absolute path> -> exactly that binary
        nodePath: auto
        # Per-call timeout for one playwright-cli invocation, milliseconds.
        attachTimeoutMs: 60000
        timeoutMs: 20000
        # How long a tool waits for the DSH page to answer a bridge request.
        requestTimeoutMs: 20000
        # How long to wait for a first frame after bringing a tab to the front
        # for a screenshot, milliseconds.
        screenshotTimeoutMs: 25000
        screenshotSettleMs: 1200
        # Set true to print bridge/CLI diagnostics with console.debug.
        debug: false



