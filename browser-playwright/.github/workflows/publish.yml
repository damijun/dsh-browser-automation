name: Publish

# Manual only: publishing is a separate, deliberate action.
# Requires a repository secret NPM_TOKEN. `--provenance` also requires a public repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dsh-browser-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
